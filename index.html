<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>Qibla Map</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#0b0b14; --fg:#f5f5f7; --muted:#6e6e80; --accent:#f0b429; --ok:#34c759; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--fg);
    overflow:hidden; position:relative;
  }

  /* Full-bleed map */
  #map { position:absolute; inset:0; background:#111; }

  /* Compass HUD overlay, top-left */
  .compass-hud {
    position:absolute;
    top:calc(16px + env(safe-area-inset-top));
    left:calc(16px + env(safe-area-inset-left));
    width:128px; height:128px;
    z-index:5;
    border-radius:50%;
    background:rgba(11,11,20,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 6px 24px rgba(0,0,0,0.45);
    padding:8px;
    cursor:pointer;
    transition:transform .15s;
  }
  .compass-hud:active { transform:scale(0.97); }

  .compass { position:relative; width:100%; height:100%; }
  .ring, .needle { position:absolute; inset:0; border-radius:50%; }
  .ring { transition:transform .15s linear; will-change:transform; }
  .ring svg, .needle svg { width:100%; height:100%; display:block; }
  .needle {
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s linear; will-change:transform;
  }
  .needle svg { filter:drop-shadow(0 0 10px rgba(240,180,41,.5)); transition:filter .3s; }
  .aligned .needle svg { filter:drop-shadow(0 0 14px rgba(52,199,89,.9)); }
  .needle svg .arrow-fill { transition:fill .3s; }
  .aligned .needle svg .arrow-fill { fill:var(--ok); }

  /* Status pill at bottom */
  .status-bar {
    position:absolute;
    left:50%;
    bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:5;
    background:rgba(11,11,20,0.8);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:999px;
    padding:10px 20px;
    text-align:center;
    max-width:calc(100vw - 32px);
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  .status { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .3s; }
  .aligned .status { color:var(--ok); }
  .bearing { font-size:10px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; letter-spacing:0.3px; }

  /* Start overlay */
  .overlay {
    position:fixed; inset:0; z-index:20;
    background:rgba(11,11,20,0.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; text-align:center; gap:16px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .overlay h2 { font-size:20px; font-weight:600; }
  .overlay p { color:var(--muted); font-size:14px; line-height:1.5; max-width:320px; }
  .btn {
    background:var(--accent); color:#1a1a1a; border:none; border-radius:999px;
    padding:14px 36px; font-size:16px; font-weight:600; cursor:pointer;
    transition:transform .1s;
  }
  .btn:active { transform:scale(.96); }
  .btn.secondary { background:rgba(255,255,255,0.08); color:var(--fg); }
  .hidden { display:none !important; }
  .spinner {
    width:36px; height:36px; border-radius:50%;
    border:3px solid rgba(255,255,255,.1); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCUdt3TLFd_ZyqqjhKfYMzRzyZqOYDTzKM&libraries=geometry&loading=async"></script>
</head>
<body>

<div id="map"></div>

<div class="compass-hud" id="compassHud" role="button" tabindex="0" aria-label="Compass — tap to retry">
  <div class="compass" id="compass">
    <div class="ring" id="ring"></div>
    <div class="needle" id="needle">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <polygon class="arrow-fill" points="100,30 116,110 100,96 84,110" fill="#f0b429"/>
        <polygon points="100,170 94,120 100,126 106,120" fill="rgba(255,255,255,0.22)"/>
        <circle cx="100" cy="100" r="3.5" fill="#f5f5f7"/>
      </svg>
    </div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <div class="status" id="status">Locating…</div>
  <div class="bearing" id="bearing"></div>
</div>

<div class="overlay" id="overlay">
  <div class="spinner" id="spinner"></div>
  <h2 id="overlayTitle">Find the Qibla</h2>
  <p id="overlayText">We'll use your location and compass to point you toward the Kaaba.</p>
  <button class="btn" id="startBtn">Start</button>
</div>

<script>
"use strict";

const KAABA = { lat: 21.4224779, lon: 39.8251832 };
const QIBLA_LINE_KM = 12;    // length of the Qibla ray drawn on the map
const INITIAL_ZOOM = 16;     // neighborhood-level zoom on user's position
const MOTION_TIMEOUT_MS = 3000;

const $ = id => document.getElementById(id);
const mapEl = $("map"), compassEl = $("compass"), ringEl = $("ring"), needleEl = $("needle");
const compassHud = $("compassHud"), statusEl = $("status"), bearingEl = $("bearing");
const overlayEl = $("overlay"), overlayTitle = $("overlayTitle"), overlayText = $("overlayText");
const startBtn = $("startBtn"), spinnerEl = $("spinner");

let map, userMarker, qiblaLine, userLatLng;
let qiblaBearing = null;
let smoothedHeading = null;
let wasAligned = false;
let orientationAttached = false;
let motionReceived = false;
let motionTimeoutHandle = null;

const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;

/* ---------- Math ---------- */
function calculateBearing(lat1, lon1, lat2, lon2) {
  const φ1 = toRad(lat1), φ2 = toRad(lat2), Δλ = toRad(lon2 - lon1);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function destinationPoint(lat, lon, bearing, km) {
  const R = 6371, δ = km / R, θ = toRad(bearing);
  const φ1 = toRad(lat), λ1 = toRad(lon);
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(
    Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
    Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2)
  );
  return { lat: toDeg(φ2), lng: ((toDeg(λ2) + 540) % 360) - 180 };
}

function smoothHeading(next) {
  if (smoothedHeading === null) { smoothedHeading = next; return next; }
  let d = next - smoothedHeading;
  if (d > 180) d -= 360; else if (d < -180) d += 360;
  smoothedHeading = (smoothedHeading + d * 0.30 + 360) % 360;
  return smoothedHeading;
}

/* ---------- Compass ring ---------- */
function buildRing() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 200 200");
  for (let i = 0; i < 72; i++) {
    const a = toRad(i * 5), major = i % 9 === 0;
    const r1 = 92, r2 = major ? 80 : 86;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 100 + r1 * Math.sin(a));
    l.setAttribute("y1", 100 - r1 * Math.cos(a));
    l.setAttribute("x2", 100 + r2 * Math.sin(a));
    l.setAttribute("y2", 100 - r2 * Math.cos(a));
    l.setAttribute("stroke", major ? "rgba(255,255,255,.32)" : "rgba(255,255,255,.12)");
    l.setAttribute("stroke-width", major ? "1.4" : "0.8");
    l.setAttribute("stroke-linecap", "round");
    svg.appendChild(l);
  }
  [["N",100,26,"#f5f5f7"],["E",172,105,"#6e6e80"],["S",100,180,"#6e6e80"],["W",28,105,"#6e6e80"]]
    .forEach(([t,x,y,c]) => {
      const el = document.createElementNS(NS, "text");
      el.setAttribute("x", x); el.setAttribute("y", y);
      el.setAttribute("text-anchor", "middle");
      el.setAttribute("font-size", "11");
      el.setAttribute("font-weight", "700");
      el.setAttribute("fill", c);
      el.setAttribute("font-family", "-apple-system, system-ui, sans-serif");
      el.textContent = t;
      svg.appendChild(el);
    });
  ringEl.appendChild(svg);
}

/* ---------- Map ---------- */
function initMap(lat, lon, bearing) {
  userLatLng = { lat, lng: lon };
  const center = { lat, lng: lon };

  map = new google.maps.Map(mapEl, {
    center,
    zoom: INITIAL_ZOOM,
    disableDefaultUI: true,
    zoomControl: false,
    gestureHandling: "greedy",
    clickableIcons: false,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
  });

  userMarker = new google.maps.Marker({
    map,
    position: center,
    title: "You",
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 7,
      fillColor: "#34c759",
      fillOpacity: 1,
      strokeColor: "#fff",
      strokeWeight: 2.5,
    },
    zIndex: 2,
  });

  const end = destinationPoint(lat, lon, bearing, QIBLA_LINE_KM);
  qiblaLine = new google.maps.Polyline({
    map,
    path: [center, end],
    strokeColor: "#f0b429",
    strokeOpacity: 0.95,
    strokeWeight: 4,
    zIndex: 1,
  });
}

/* ---------- Orientation ---------- */
function handleOrientation(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === "number" && e.webkitCompassHeading >= 0) {
    h = e.webkitCompassHeading;
  } else if ((e.type === "deviceorientationabsolute" || e.absolute === true) &&
             typeof e.alpha === "number" && e.alpha !== null) {
    h = (360 - e.alpha) % 360;
  }
  if (h === null) return;

  if (!motionReceived) {
    motionReceived = true;
    if (motionTimeoutHandle) { clearTimeout(motionTimeoutHandle); motionTimeoutHandle = null; }
  }
  smoothedHeading = smoothHeading(h);
  render();
}

function attachOrientation() {
  if (orientationAttached) return;
  orientationAttached = true;
  let gotAbsolute = false;
  window.addEventListener("deviceorientationabsolute", e => {
    gotAbsolute = true; handleOrientation(e);
  }, true);
  window.addEventListener("deviceorientation", e => {
    if (!gotAbsolute) handleOrientation(e);
  }, true);
}

/* ---------- Render compass + status ---------- */
function render() {
  if (smoothedHeading === null || qiblaBearing === null) return;

  const needleAngle = qiblaBearing - smoothedHeading;
  needleEl.style.transform = `rotate(${needleAngle}deg)`;
  ringEl.style.transform = `rotate(${-smoothedHeading}deg)`;

  const signed = (((needleAngle + 180) % 360) + 360) % 360 - 180;
  const aligned = Math.abs(signed) < 5;
  compassEl.classList.toggle("aligned", aligned);
  document.body.classList.toggle("aligned", aligned);

  statusEl.textContent = aligned
    ? "You're facing the Qibla ✓"
    : `Turn ${signed > 0 ? "right" : "left"} ${Math.round(Math.abs(signed))}°`;
  bearingEl.textContent = `Qibla ${qiblaBearing.toFixed(0)}° · Heading ${smoothedHeading.toFixed(0)}°`;

  if (aligned && !wasAligned && navigator.vibrate) navigator.vibrate(50);
  wasAligned = aligned;
}

/* ---------- Static fallback when compass is unavailable ---------- */
function compassUnavailable(reason) {
  needleEl.style.opacity = "0.25";
  ringEl.style.opacity = "0.25";
  statusEl.textContent = `Compass unavailable · Qibla ${qiblaBearing.toFixed(0)}° N`;
  bearingEl.textContent = reason || "Tap the compass to retry";
}

/* ---------- Overlay ---------- */
function showOverlay(title, text, spinning = false, actionLabel = null) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  spinnerEl.classList.toggle("hidden", !spinning);
  startBtn.classList.toggle("hidden", !actionLabel);
  if (actionLabel) startBtn.textContent = actionLabel;
  overlayEl.classList.remove("hidden");
}
function hideOverlay() { overlayEl.classList.add("hidden"); }

/* ---------- Main flow ---------- */
async function start() {
  hideOverlay();
  showOverlay("Locating…", "Getting your position to draw the Qibla line.", true);

  if (!navigator.geolocation) {
    showOverlay("Not supported", "Your browser does not support geolocation.", false, null);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      qiblaBearing = calculateBearing(lat, lon, KAABA.lat, KAABA.lon);

      try {
        initMap(lat, lon, qiblaBearing);
      } catch (e) {
        console.warn("Map failed:", e);
      }

      // Try compass within the same user gesture
      await requestCompass();

      hideOverlay();

      if (motionReceived) {
        statusEl.textContent = "Hold phone flat to aim";
      } else {
        // Start the "no data yet" clock
        motionTimeoutHandle = setTimeout(() => {
          if (!motionReceived) {
            compassUnavailable("Brave? Enable Motion Sensors in site settings");
          }
        }, MOTION_TIMEOUT_MS);
      }
    },
    err => {
      const msg = err.code === err.PERMISSION_DENIED
        ? "Location permission was denied. Enable it in site settings and retry."
        : (err.message || "Could not get your location.");
      showOverlay("Location error", msg, false, "Retry");
      startBtn.onclick = () => location.reload();
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

async function requestCompass() {
  if (typeof DeviceOrientationEvent === "undefined") {
    compassUnavailable("No motion sensor API");
    return;
  }
  // iOS-style explicit permission
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === "granted") {
        attachOrientation();
      } else {
        compassUnavailable("Motion permission denied");
      }
    } catch (e) {
      compassUnavailable("Motion permission error");
    }
    return;
  }
  // Android / desktop: attach; if nothing fires, we detect after timeout
  attachOrientation();
}

/* ---------- Tap compass HUD to retry ---------- */
compassHud.addEventListener("click", async () => {
  if (qiblaBearing === null) return;
  motionReceived = false;
  needleEl.style.opacity = "1";
  ringEl.style.opacity = "1";
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") { compassUnavailable("Motion permission denied"); return; }
    } catch { compassUnavailable("Motion permission error"); return; }
  }
  attachOrientation();
  motionTimeoutHandle = setTimeout(() => {
    if (!motionReceived) compassUnavailable("Still no motion data — check browser settings");
  }, MOTION_TIMEOUT_MS);
});

/* ---------- Boot ---------- */
buildRing();
startBtn.onclick = start;

/* ---------- Service worker + auto-reload on update ---------- */
if ("serviceWorker" in navigator) {
  // Reload once when a new SW takes over (so users see fresh HTML automatically)
  let refreshing = false;
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
